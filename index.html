<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOSH - Juego de Cartas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════════════
       PANTALLA 1: Configuración
  ════════════════════════════════════════════════════ -->
  <div id="screen-setup" class="screen active">
    <div class="setup-box">
      <h1 class="game-title">DOSH</h1>
      <p class="game-subtitle">Juego de cartas</p>

      <!-- Número de jugadores -->
      <div class="form-group">
        <label>Jugadores</label>
        <div class="number-control">
          <button id="btn-less-players" class="btn-num">−</button>
          <span id="val-players">2</span>
          <button id="btn-more-players" class="btn-num">+</button>
        </div>
      </div>

      <!-- Cartas por jugador -->
      <div class="form-group">
        <label>Cartas por jugador <small>(número par)</small></label>
        <div class="number-control">
          <button id="btn-less-cards" class="btn-num">−</button>
          <span id="val-cards">4</span>
          <button id="btn-more-cards" class="btn-num">+</button>
        </div>
      </div>

      <!-- Nombres de los jugadores (generados dinámicamente) -->
      <div id="player-names"></div>

      <!-- Mensaje de error -->
      <div id="setup-error" class="error-msg hidden"></div>

      <button id="btn-start" class="btn-primary">INICIAR PARTIDA</button>
    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════
       PANTALLA 2: Fase de memoria (mirar cartas)
  ════════════════════════════════════════════════════ -->
  <div id="screen-peek" class="screen">
    <div class="peek-box">

      <div class="peek-header">
        <div id="peek-progress" class="peek-progress"></div>
        <h2 id="peek-player-name"></h2>
        <p id="peek-instruction"></p>
      </div>

      <!-- Timer (oculto hasta que el jugador presione "Listo") -->
      <div id="peek-timer-container" class="hidden">
        <div class="timer-bar-wrap">
          <div id="peek-timer-bar" class="timer-bar"></div>
        </div>
        <span id="peek-timer-text" class="timer-text">10</span>
      </div>

      <!-- Cartas del jugador actual -->
      <div id="peek-cards" class="peek-cards"></div>

      <!-- Botones de acción -->
      <div class="peek-actions">
        <button id="btn-peek-ready" class="btn-primary">¡ESTOY LISTO!</button>
        <button id="btn-peek-done"  class="btn-secondary hidden">YA MEMORICÉ</button>
        <button id="btn-peek-next"  class="btn-primary hidden">SIGUIENTE →</button>
      </div>

    </div>
  </div>


  <!-- ═══════════════════════════════════════════════════
       PANTALLA 3: Mesa de juego
  ════════════════════════════════════════════════════ -->
  <div id="screen-game" class="screen">

    <header class="game-header">
      <h1 class="game-title small">DOSH</h1>
      <div id="game-status" class="game-status"></div>
      
      <!-- Temporizador de 15 segundos para el turno -->
      <div id="turn-timer-container" class="turn-timer-container hidden">
        <span class="turn-timer-icon">⏱</span>
        <div class="turn-timer-bar-wrap">
          <div id="turn-timer-bar" class="turn-timer-bar"></div>
        </div>
        <span id="turn-timer-val" class="turn-timer-val">15s</span>
      </div>

      <button id="btn-new-game" class="btn-small">Nueva partida</button>
    </header>

    <div class="game-table">

      <!-- Área de jugadores -->
      <div id="players-area" class="players-area"></div>

      <!-- Centro: mazo + carta en mesa -->
      <div class="center-area">
        <div class="center-slot">
          <div id="deck-pile" class="card face-down deck-card">
            <span id="deck-count" class="deck-count"></span>
          </div>
          <p class="area-label">MAZO</p>
        </div>
        <div class="center-slot" id="drawn-slot-container">
          <div id="drawn-card-slot" class="discard-placeholder">
            <span>VACÍO</span>
          </div>
          <p class="area-label">CARTA EN MESA</p>
        </div>
      </div>

    </div>

    <!-- Pie: mensajes y botones de acción (Fase 2+) -->
    <footer class="game-footer">
      <div id="game-message" class="game-message"></div>
      <div id="action-buttons" class="action-buttons"></div>
    </footer>

    <!-- Modal de Fin de Partida / Puntajes DOSH -->
    <div id="modal-game-over" class="modal-overlay hidden">
      <div class="modal-box">
        <h2 id="game-over-title">🏆 ¡FIN DE LA PARTIDA!</h2>
        <p id="game-over-subtitle" class="game-over-sub"></p>
        <div id="game-over-results" class="game-over-results"></div>
        <button id="btn-modal-restart" class="btn-primary">NUEVA PARTIDA</button>
      </div>
    </div>

  </div>


  <!-- Cargar archivos JS en orden de dependencia -->
  <script src="js/rules.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v31edd6df95cf4e85bb4c19e7a9bdbcba1788362987495" integrity="sha512-iIg7k2xntmwu6/uSb5tpc/hySgZc4eoL31yB29W6tJFo2akwjPWcEqnCEdJvGexCL0KEQwVYv5BlowfhVz26hg==" data-cf-beacon='{"version":"2024.11.0","token":"f0f03d0605bf45f1a3b17cf7d5e6861f","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
